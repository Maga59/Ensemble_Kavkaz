<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Галерея — Ансамбль Кавказ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --black: #0a0a0c;
      --dark-surface: #141218;
      --purple: #4a1e5c;
      --purple-light: #6d3383;
      --gold: #d4af37;
      --text-main: #e0dce4;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--black);
      color: var(--text-main);
      line-height: 1.7;
      min-height: 100vh;
      position: relative;
    }
    
    /* ФОН БУТА (черный) */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: -2;
      background-image: url('buta.png'), url('buta.jpg');
      background-size: 400px;
      background-repeat: repeat;
      opacity: 0.05;
      filter: blur(2px) invert(1);
    }

    a { color: inherit; text-decoration: none; }

    /* ===== Header ===== */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { font-weight: 700; font-size: 1.3rem; letter-spacing: 1px; color: var(--gold); font-family: 'Cinzel', serif; }
    
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 8px;
      background: var(--purple); color: var(--gold);
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem;
      transition: background 0.3s;
    }
    .back-btn:hover { background: var(--purple-light); }

    /* ===== Gallery Section ===== */
    .gallery-section {
      padding: 120px 24px 80px;
      max-width: 1400px; margin: 0 auto;
      position: relative; z-index: 2;
    }
    
    .section-title {
      text-align: center; font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 700;
      margin-bottom: 40px; letter-spacing: 2px; color: var(--gold); font-family: 'Cinzel', serif;
    }

    /* ИДЕАЛЬНАЯ MASONRY-СЕТКА */
    .gallery-grid {
      column-count: 3;
      column-gap: 20px;
    }
    
    .gallery-item {
      break-inside: avoid;
      margin-bottom: 20px;
      border-radius: var(--radius);
      border: 1px solid rgba(74, 30, 92, 0.3);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
      background: var(--dark-surface);
    }
    
    .gallery-item img { 
      width: 100%; 
      height: auto; 
      display: block; 
      transition: transform 0.5s; 
      cursor: zoom-in;
    }
    
    .gallery-item:hover { 
      border-color: var(--gold); 
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(212, 175, 55, 0.2);
      z-index: 10;
    }
    .gallery-item:hover img { transform: scale(1.03); }

    /* Адаптивность */
    @media (max-width: 992px) {
      .gallery-grid { column-count: 2; }
    }
    @media (max-width: 640px) {
      .gallery-grid { column-count: 1; }
      header { flex-direction: column; gap: 12px; text-align: center; }
      .gallery-section { padding-top: 140px; }
    }
  </style>
</head>
<body>

  <header>
