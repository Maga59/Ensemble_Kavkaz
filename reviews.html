<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оставить отзыв — Ансамбль Кавказ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --black: #0a0a0c;
      --dark-surface: #141218;
      --purple: #4a1e5c;
      --purple-light: #6d3383;
      --gold: #d4af37;
      --text-main: #e0dce4;
      --text-muted: #9e95a3;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--black);
      color: var(--text-main);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Фон с гранатами */
    body::before {
      content: "";
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('granat.png'); /* Название файла с гранатами */
      background-size: cover; background-position: center;
      opacity: 0.25; z-index: -2;
    }
    
    /* Темная вуаль, чтобы форма читалась */
    body::after {
      content: "";
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 12, 0.85);
      z-index: -1;
    }

    .review-container {
      width: 100%; max-width: 650px;
      background: var(--dark-surface);
      border-radius: var(--radius);
      padding: 50px 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      position: relative;
      margin: 20px;
    }

    /* Крестик закрытия */
    .close-btn {
      position: absolute; top: 20px; right: 25px;
      font-size: 2rem; color: var(--purple-light); line-height: 1;
      text-decoration: none; font-weight: bold;
      transition: transform 0.2s, color 0.2s;
    }
    .close-btn:hover { transform: scale(1.1); color: var(--gold); }

    .form-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .form-header h2 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 2.5rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .form-header p {
      color: var(--text-muted); font-size: 1rem;
    }

    /* Поля ввода */
    .form-group {
      margin-bottom: 25px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(74, 30, 92, 0.6);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      background: var(--black);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--gold);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 150px;
    }
    
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #7a6b7d;
    }

    /* Кнопка отправки */
    .submit-btn {
      display: block; width: 100%;
      padding: 18px;
      background: var(--purple);
      color: var(--gold);
      border: 2px solid var(--purple);
      border-radius: 50px;
      font-size: 1.1rem; font-weight: 600;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .submit-btn:hover {
      background: var(--purple-light);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(74,30,92,0.4);
    }

  </style>
</head>
<body>

  <div class="review-container">
    <a href="index.html" class="close-btn">×</a>

    <div class="form-header">
      <h2>Оставьте ваш отзыв</h2>
      <p>Нам очень важно ваше мнение о нашем коллективе!</p>
    </div>

    <!-- Форма отправки на почту -->
    <form action="mailto:kavkaz2026ensemble@gmail.com" method="post" enctype="text/plain" onsubmit="return sendReview(this);">
      
      <div class="form-group">
        <input type="text" id="review-name" name="Имя" placeholder="Имя" required>
      </div>
      
      <div class="form-group">
        <input type="email" id="review-email" name="E-mail" placeholder="E-mail" required>
      </div>
      
      <div class="form-group">
        <textarea id="review-text" name="Отзыв" placeholder="Отзыв" required></textarea>
      </div>

      <button type="submit" class="submit-btn">Отправить</button>
    </form>
  </div>

  <script>
    // Скрипт для красивого формирования письма
    function sendReview(form) {
      const name = document.getElementById('review-name').value;
      const email = document.getElementById('review-email').value;
      const text = document.getElementById('review-text').value;

      const subject = encodeURIComponent("Новый отзыв с сайта Ансамбль Кавказ");
      const body = encodeURIComponent(
        "Имя: " + name + "\n" +
        "E-mail: " + email + "\n\n" +
        "Отзыв:\n" + text
      );

      window.location.href = "mailto:kavkaz2026ensemble@gmail.com?subject=" + subject + "&body=" + body;
      return false;
    }
  </script>

</body>
</html>
