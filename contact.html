<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Связаться с нами — Ансамбль Кавказ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --black: #0a0a0c;
      --dark-surface: #141218;
      --purple: #4a1e5c;
      --purple-light: #6d3383;
      --gold: #d4af37;
      --text-main: #e0dce4;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--black);
      color: var(--text-main);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* Твой узор с гранатами на фоне */
    body::before {
      content: "";
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      /* Замени 'granat.png' на точное название файла, которое ты загрузил в GitHub */
      background-image: url('granat.png'); 
      background-size: cover; background-position: center;
      opacity: 0.3; z-index: -2;
    }
    
    /* Затемнение поверх узора, чтобы форма читалась */
    body::after {
      content: "";
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 12, 0.85); /* Черная вуаль */
      z-index: -1;
    }

    .contact-container {
      width: 100%; max-width: 600px;
      background: var(--dark-surface);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid rgba(74, 30, 92, 0.5);
      position: relative;
      margin: 20px;
    }

    /* Кнопка закрытия (крестик) - фиолетовый */
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      font-size: 2rem; color: var(--purple-light); line-height: 1;
      text-decoration: none; font-weight: bold;
      transition: transform 0.2s, color 0.2s;
    }
    .close-btn:hover { transform: scale(1.1); color: var(--gold); }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-header h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .form-header p {
      color: var(--text-main); font-size: 0.9rem;
    }

    /* Поля ввода */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(74, 30, 92, 0.5);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      background: var(--black);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--gold);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #7a6b7d;
    }

    /* Кнопка отправки - фиолетовая */
    .submit-btn {
      display: block; width: 100%;
      padding: 16px;
      background: var(--purple);
      color: var(--gold);
      border: 2px solid var(--purple);
      border-radius: 50px;
      font-size: 1rem; font-weight: 600;
      font-family: 'Cinzel', serif;
      text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .submit-btn:hover {
      background: var(--purple-light);
      transform: translateY(-2px);
    }

  </style>
</head>
<body>

  <div class="contact-container">
    <a href="index.html" class="close-btn">×</a>

    <div class="form-header">
      <h2>Связаться с нами</h2>
      <p>Заполните форму, и мы ответим вам на почту!</p>
    </div>

    <!-- Форма, которая открывает почтовую программу -->
    <form action="mailto:kavkaz2026ensemble@gmail.com" method="post" enctype="text/plain" onsubmit="return sendEmail(this);">
      
      <div class="form-group">
        <input type="text" id="name" name="Имя" placeholder="Имя" required>
      </div>
      <div class="form-group">
        <input type="tel" id="phone" name="Телефон" placeholder="Телефон" required>
      </div>
      <div class="form-group">
        <input type="email" id="email" name="Email" placeholder="E-mail" required>
      </div>
      <div class="form-group">
        <textarea id="message" name="Сообщение" placeholder="Сообщение"></textarea>
      </div>

      <button type="submit" class="submit-btn">Отправить</button>
    </form>
  </div>

  <script>
    function sendEmail(form) {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      const subject = encodeURIComponent("Заявка с сайта Ансамбль Кавказ");
      const body = encodeURIComponent(
        "Имя: " + name + "\n" +
        "Телефон: " + phone + "\n" +
        "Email: " + email + "\n\n" +
        "Сообщение:\n" + message
      );

      window.location.href = "mailto:kavkaz2026ensemble@gmail.com?subject=" + subject + "&body=" + body;
      return false;
    }
  </script>

</body>
</html>

</body>
</html>
