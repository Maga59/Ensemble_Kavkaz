<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Связаться с нами — Ансамбль Кавказ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --white: #ffffff;
      --wine: #5e1a22;
      --wine-dark: #421117;
      --gold: #c9a227;
      --text: #2b1a1c;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #111;
      color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* Фон */
    body::before {
      content: "";
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('photo1.jpg'); /* Твоя фотография на фоне */
      background-size: cover; background-position: center;
      opacity: 0.3; z-index: -1;
    }

    .contact-container {
      width: 100%; max-width: 600px;
      background: var(--white);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
      margin: 20px;
    }

    /* Кнопка закрытия (крестик) */
    .close-btn {
      position: absolute; top: 20px; right: 20px;
      font-size: 2rem; color: #d32f2f; line-height: 1;
      text-decoration: none; font-weight: bold;
      transition: transform 0.2s;
    }
    .close-btn:hover { transform: scale(1.1); }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-header h2 {
      font-family: 'Cinzel', serif;
      color: var(--wine);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    .form-header p {
      color: #777; font-size: 0.9rem;
    }

    /* Поля ввода */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      background: #fafafa;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--wine);
      background: #fff;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Красная кнопка */
    .submit-btn {
      display: block; width: 100%;
      padding: 16px;
      background: #d32f2f;
      color: #fff;
      border: none; border-radius: 50px;
      font-size: 1rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }
    .submit-btn:hover {
      background: #b71c1c;
      transform: translateY(-2px);
    }

  </style>
</head>
<body>

  <div class="contact-container">
    <!-- Кнопка закрытия (ведет на главную) -->
    <a href="index.html" class="close-btn">×</a>

    <div class="form-header">
      <h2>Связаться с нами</h2>
      <p>Заполните форму, и мы ответим вам на почту!</p>
    </div>

    <!-- ФОРМА, КОТОРАЯ ОТКРЫВАЕТ ПОЧТОВУЮ ПРОГРАММУ -->
    <!-- Обрати внимание на onsubmit. Он собирает данные и отправляет их на твою почту -->
    <form action="mailto:kavkaz2026ensemble@gmail.com" method="post" enctype="text/plain" onsubmit="return sendEmail(this);">
      
      <div class="form-group">
        <input type="text" id="name" name="Имя" placeholder="Имя" required>
      </div>
      <div class="form-group">
        <input type="tel" id="phone" name="Телефон" placeholder="Телефон" required>
      </div>
      <div class="form-group">
        <input type="email" id="email" name="Email" placeholder="E-mail" required>
      </div>
      <div class="form-group">
        <textarea id="message" name="Сообщение" placeholder="Сообщение"></textarea>
      </div>

      <button type="submit" class="submit-btn">Отправить</button>
    </form>
  </div>

  <script>
    // Функция, которая красиво формирует письмо и открывает почтовик
    function sendEmail(form) {
      // Получаем данные из полей
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      // Формируем тему и текст письма
      const subject = encodeURIComponent("Заявка с сайта Ансамбль Кавказ");
      const body = encodeURIComponent(
        "Имя: " + name + "\n" +
        "Телефон: " + phone + "\n" +
        "Email: " + email + "\n\n" +
        "Сообщение:\n" + message
      );

      // Открываем почтовую программу с заполненными данными
      window.location.href = "mailto:kavkaz2026ensemble@gmail.com?subject=" + subject + "&body=" + body;

      // Останавливаем стандартную отправку формы (чтобы страница не перезагружалась)
      return false;
    }
  </script>

</body>
</html>
